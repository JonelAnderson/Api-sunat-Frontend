





      
<div class="modal-header">
    <h5 class="modal-title color-modal-title">Visor de Imagenes</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close()"></button>
</div>
<div class="modal-body"> 
    <div class="row">
        <div class="col-md-12">
            <ng-container *ngIf="fileUrlData">
                <div class="preview-dialog">
                    <div class="mdc-dialog__content">
                        <img [src]="fileUrlData" alt="Preview" class="image-preview">
                    </div>
            
                    <div class="zoom-buttons">
                        <button class="zoom-button" (click)="zoomIn()">
                            <mat-icon>zoom_in</mat-icon>
                        </button>
                        <button class="zoom-button" (click)="zoomOut()">
                            <mat-icon>zoom_out</mat-icon>
                        </button>
                    </div>
                    
                    <!-- <button class="text-secondary button-close" mat-dialog-close mat-icon-button type="button">
                        <mat-icon fontIcon="close" class="icon-close-modal"></mat-icon>
                    </button> -->
                    
                </div>
            </ng-container>
        </div>
    </div>


</div>
  
<div class="modal-footer">
    <button mat-button  (click)="activeModal.close()">CERRAR</button>
</div>
